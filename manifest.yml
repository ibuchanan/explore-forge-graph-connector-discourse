app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/f8cf141b-d37c-4c18-8f53-01cf3e6fa8b6
modules:
  graph:connector:
    - key: discourse-connector
      name: Discourse
      capabilities:
        replicatesPermissions: false
        supportsIncrementalSync: false
        syncFidelity: upsert
      datasource:
        onConnectionChange:
          function: onConnectionChange
      icons:
        dark: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
        light: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      objectTypes:
        - atlassian:conversation
        - atlassian:message
      orchestration:
        taskRunner:
          function: taskRunner
  function:
    - key: onConnectionChange
      handler: index.onConnectionChange
    - key: taskRunner
      handler: index.taskRunner
      timeoutSeconds: 900
permissions:
  external:
    fetch:
      backend:
        # Forge cannot express admin configuration for backend addresses.
        # If you have forked this app, you can narrow the address to your Discourse site.
        - address: "*"
  scopes:
    - delete:object:jira
    - read:object:jira
    - write:object:jira
    - storage:app
